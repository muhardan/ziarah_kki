<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transparansi Dana Ziaroh Wali 5 KKI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --text-main: #0b1329;
      --text-muted: #64748b;
      --emerald: #059669;
      --amber: #d97706;
      --rose: #e11d48;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      /* Background dinamis agar efek bias kaca tembus pandang terlihat nyata */
      background-color: #f1f5f9;
      background-image: 
        radial-gradient(at 15% 15%, rgba(16, 185, 129, 0.12) 0px, transparent 45%),
        radial-gradient(at 85% 20%, rgba(59, 130, 246, 0.12) 0px, transparent 45%),
        radial-gradient(at 50% 50%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 20% 80%, rgba(147, 51, 234, 0.1) 0px, transparent 45%),
        radial-gradient(at 80% 85%, rgba(6, 182, 212, 0.12) 0px, transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 0;
      padding-bottom: 130px; /* Ruang agar kartu bisa digulir tembus di bawah dock */
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===================================================
       OPTICAL LIQUID GLASS DOCK (PERSIS SEPERTI DI VIDEO)
       =================================================== */
    .liquid-dock-wrapper {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      pointer-events: none;
    }
    .liquid-dock {
      pointer-events: auto;
      /* Kaca Bening Tipis: Konten di belakang langsung terbias tembus */
      background: rgba(255, 255, 255, 0.32);
      backdrop-filter: blur(28px) saturate(210%) contrast(105%);
      -webkit-backdrop-filter: blur(28px) saturate(210%) contrast(105%);
      
      /* Beveled Crystal Rim */
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-top: 1.5px solid rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 9999px;
      padding: 5px 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      
      /* Inset Specular Glare (Kilauan Lensa Kaca Cembung) */
      box-shadow: 
        inset 0 1.5px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 2px rgba(15, 23, 42, 0.05),
        0 16px 36px -6px rgba(15, 23, 42, 0.12),
        0 4px 14px rgba(0, 0, 0, 0.04);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .dock-pill-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 18px;
      border-radius: 9999px;
      color: #334155;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      min-width: 82px;
    }
    .dock-pill-btn i { font-size: 1.05rem; margin-bottom: 2px; }
    .dock-pill-btn:hover { color: #0b1329; transform: translateY(-1px); }
    .dock-pill-btn.active {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.4),
        0 6px 16px -2px rgba(15, 23, 42, 0.3);
    }
    .dock-pill-btn.active i { color: #ffffff !important; }

    /* ===================================================
       LIQUID GLASS CARDS & SEARCH BAR
       =================================================== */
    .liquid-glass-card {
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-top: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 
        inset 0 1.2px 2px rgba(255, 255, 255, 0.95),
        inset 0 -1.5px 2px rgba(15, 23, 42, 0.03),
        0 14px 30px -8px rgba(15, 23, 42, 0.06),
        0 2px 6px rgba(15, 23, 42, 0.02);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .liquid-glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 
        inset 0 1.5px 2px rgba(255, 255, 255, 1),
        0 20px 40px -10px rgba(15, 23, 42, 0.1),
        0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .liquid-glass-card.is-pinned {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.55) 0%, rgba(255, 255, 255, 0.35) 100%);
      border-left: 3.5px solid var(--emerald);
    }

    /* SEARCH BAR */
    .search-panel {
      background: rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-top: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 7px 10px;
      margin-bottom: 22px;
      box-shadow: 
        inset 0 1.2px 2px rgba(255, 255, 255, 0.95),
        0 10px 25px -6px rgba(15, 23, 42, 0.05);
    }
    .search-input {
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 14px;
      padding: 9px 14px 9px 40px;
      font-size: 0.88rem;
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.8);
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
      outline: none;
    }

    /* KAPSUL STATUS & BUTTONS */
    .glass-pill {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: inset 0 1px 1px #fff, 0 3px 8px rgba(0, 0, 0, 0.03);
    }
    .status-lunas { color: #047857; background: rgba(209, 250, 229, 0.7); }
    .status-cicilan { color: #b45309; background: rgba(254, 243, 199, 0.7); }
    .status-belum { color: #be123c; background: rgba(255, 228, 230, 0.7); }

    .glass-btn {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 1.2px solid rgba(255, 255, 255, 0.9);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #1e293b;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: inset 0 1px 1px #fff, 0 4px 12px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-btn:hover {
      background: #ffffff;
      color: var(--emerald);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.15);
    }

    .finance-inset {
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 16px;
      padding: 12px 14px;
      margin: 12px 0;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
    }
    .clean-progress-track {
      height: 6px;
      background: rgba(203, 213, 225, 0.5);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .clean-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #06b6d4 100%);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* GRID */
    .cards-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
    @media (min-width: 1100px) { .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }

    /* SKELETON LOADING */
    .skeleton-card {
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skeleton-line {
      height: 14px;
      background: linear-gradient(90deg, rgba(226, 232, 240, 0.5) 25%, rgba(255, 255, 255, 0.85) 50%, rgba(226, 232, 240, 0.5) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>

  <!-- KONTEN UTAMA -->
  <div class="container-xl px-3 px-md-4 pt-4" id="main-content" style="max-width: 1200px;">
    
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-1" style="font-size: 1.55rem; letter-spacing: -0.5px;">Transparansi Dana Ziaroh Wali 5 KKI</h2>
      <p class="text-muted small">Konfirmasi ke bendahara setelah melakukan transfer!</p>
    </div>

    <!-- SEARCH BAR LIQUID GLASS -->
    <div class="search-panel" id="searchSection">
      <div class="d-flex gap-2">
        <div class="position-relative flex-grow-1">
          <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted" style="font-size: 0.9rem;"></i>
          <input type="text" id="searchInput" class="form-control search-input w-100" placeholder="Ketik nama mahasiswa atau angkatan...">
        </div>
        <button class="glass-btn" onclick="fetchApiData(true)" title="Muat Ulang Data">
          <i class="fas fa-sync-alt" id="refreshIcon"></i> <span class="d-none d-sm-inline">Refresh</span>
        </button>
      </div>
    </div>

    <!-- CARDS GRID CONTAINER -->
    <div id="cards-container" class="cards-grid">
      <!-- Skeleton Liquid Glass default -->
      <div class="liquid-glass-card skeleton-card"><div class="skeleton-line" style="width: 35%;"></div><div class="skeleton-line" style="width: 70%; height: 22px;"></div><div class="skeleton-line" style="height: 65px;"></div></div>
      <div class="liquid-glass-card skeleton-card"><div class="skeleton-line" style="width: 40%;"></div><div class="skeleton-line" style="width: 65%; height: 22px;"></div><div class="skeleton-line" style="height: 65px;"></div></div>
      <div class="liquid-glass-card skeleton-card"><div class="skeleton-line" style="width: 30%;"></div><div class="skeleton-line" style="width: 75%; height: 22px;"></div><div class="skeleton-line" style="height: 65px;"></div></div>
      <div class="liquid-glass-card skeleton-card"><div class="skeleton-line" style="width: 35%;"></div><div class="skeleton-line" style="width: 60%; height: 22px;"></div><div class="skeleton-line" style="height: 65px;"></div></div>
      <div class="liquid-glass-card skeleton-card"><div class="skeleton-line" style="width: 45%;"></div><div class="skeleton-line" style="width: 80%; height: 22px;"></div><div class="skeleton-line" style="height: 65px;"></div></div>
      <div class="liquid-glass-card skeleton-card"><div class="skeleton-line" style="width: 30%;"></div><div class="skeleton-line" style="width: 65%; height: 22px;"></div><div class="skeleton-line" style="height: 65px;"></div></div>
    </div>
  </div>

  <!-- FLOATING LIQUID GLASS DOCK PERSIS VIDEO TELEGRAM -->
  <div class="liquid-dock-wrapper" id="dockWrapper">
    <div class="liquid-dock">
      <div class="dock-pill-btn" onclick="dockAksiCari()">
        <i class="fas fa-search"></i><span>Cari</span>
      </div>
      <div class="dock-pill-btn" id="dockDataSaya" onclick="toggleFilterDataSaya()">
        <i class="fas fa-star" style="color: #f59e0b;"></i><span>Data Saya</span>
      </div>
      <div class="dock-pill-btn" style="color: #059669;" onclick="konfirmasiKeBendahara()">
        <i class="fab fa-whatsapp"></i><span>Bendahara</span>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQe5Nm70lQBXLiIA7V35pAp-oYhXkjPObEGhFxd-nkb8aLx8Dsz5R78lk6mSz-jp4Pzg/exec";
    const WA_BENDAHARA = "6282131652906";

    const CACHE_KEY = "ziarah_peserta_cache";
    const PINNED_KEY = "ziarah_pinned_nama";

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);

    const getStatusPill = (status) => {
      let s = status ? status.toString().toUpperCase() : '';
      if(s === 'LUNAS') return `<span class="glass-pill status-lunas"><i class="fas fa-check-circle me-1"></i> Lunas</span>`;
      if(s === 'CICILAN') return `<span class="glass-pill status-cicilan"><i class="fas fa-coins me-1"></i> Cicilan</span>`;
      return `<span class="glass-pill status-belum"><i class="fas fa-clock me-1"></i> Belum Bayar</span>`;
    };

    let globalData = [];
    let isFilterDataSayaActive = false;

    async function fetchApiData(forceRefresh = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      // 1. SWR Cache: render instan dalam 0.05 detik jika data ada di memori
      const localCached = localStorage.getItem(CACHE_KEY);
      if (localCached && !forceRefresh) {
        try {
          const parsed = JSON.parse(localCached);
          if (parsed && parsed.data && parsed.data.length > 0) {
            globalData = parsed.data;
            renderCards();
          }
        } catch (e) {}
      }

      // 2. Background sync ke Google Apps Script
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 25000);

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?api=true`, { signal: controller.signal });
        clearTimeout(timeoutId);

        const resData = await response.json();
        const incomingData = Array.isArray(resData) ? resData : (resData.peserta ? resData.peserta : []);

        if (incomingData && incomingData.length > 0) {
          globalData = incomingData;
          localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: globalData }));
          renderCards();
        }
      } catch (error) {
        clearTimeout(timeoutId);
        console.error("Gagal sinkron data:", error);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }

    // --- DOCK ACTIONS ---
    window.dockAksiCari = function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      const searchInp = document.getElementById('searchInput');
      setTimeout(() => searchInp.focus(), 300);
    };

    window.toggleFilterDataSaya = function() {
      isFilterDataSayaActive = !isFilterDataSayaActive;
      const dockBtn = document.getElementById('dockDataSaya');
      if (isFilterDataSayaActive) dockBtn.classList.add('active');
      else dockBtn.classList.remove('active');
      renderCards();
    };

    window.resetKeSemuaPeserta = function() {
      isFilterDataSayaActive = false;
      const dockBtn = document.getElementById('dockDataSaya');
      if (dockBtn) dockBtn.classList.remove('active');
      document.getElementById('searchInput').value = '';
      renderCards();
    };

    window.togglePinNama = function(nama) {
      let savedPin = localStorage.getItem(PINNED_KEY);
      if (savedPin === nama) localStorage.removeItem(PINNED_KEY);
      else localStorage.setItem(PINNED_KEY, nama);
      renderCards();
    };

    // --- RENDER CARDS ---
    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      let kw = (document.getElementById('searchInput').value || '').toLowerCase();
      let pinnedNama = localStorage.getItem(PINNED_KEY) || '';

      let filtered = globalData.filter(p => {
        let matchKw = p['Nama Mahasiswa'].toLowerCase().includes(kw) || p.Angkatan.toString().toLowerCase().includes(kw);
        let matchDataSaya = isFilterDataSayaActive ? (p['Nama Mahasiswa'] === pinnedNama) : true;
        return matchKw && matchDataSaya;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="liquid-glass-card text-center py-5 col-12">
            <i class="fas fa-search mb-2" style="font-size: 1.5rem; color: #94a3b8;"></i>
            <div class="fw-bold">Data peserta tidak ditemukan.</div>
          </div>`;
        return;
      }

      if (!isFilterDataSayaActive) {
        filtered.sort((a, b) => {
          if (a['Nama Mahasiswa'] === pinnedNama) return -1;
          if (b['Nama Mahasiswa'] === pinnedNama) return 1;
          return 0;
        });
      }

      filtered.forEach((p) => {
        let isPinned = (p['Nama Mahasiswa'] === pinnedNama);
        let safeNama = p['Nama Mahasiswa'].replace(/'/g, "\\'");
        
        let target = p['Target Lunas'] || 0;
        let masuk = p['Total Masuk'] || 0;
        let sisa = p['Sisa Kurang'] || 0;
        let pct = target > 0 ? Math.min((masuk / target) * 100, 100).toFixed(0) : 0;

        let riwayatHtml = '';
        if (p.Riwayat && p.Riwayat.length > 0) {
          riwayatHtml = '<div class="mt-3"><div class="text-muted fw-bold mb-2" style="font-size:0.68rem; text-transform:uppercase; letter-spacing:0.5px;">Riwayat Cicilan</div>';
          p.Riwayat.forEach(r => {
            riwayatHtml += `
              <div class="d-flex justify-content-between align-items-center mb-1 p-2 rounded-3" style="background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.7); font-size: 0.76rem;">
                <div>
                  <span class="fw-bold text-dark"><i class="fas fa-check-circle text-success me-1"></i> ${r.tgl}</span>
                  <span class="text-muted ms-1" style="font-size: 0.7rem; font-style:italic;">(${r.ket || '-'})</span>
                </div>
                <span class="fw-bold text-success">${formatRp(r.nom)}</span>
              </div>`;
          });
          riwayatHtml += '</div>';
        }

        container.insertAdjacentHTML('beforeend', `
          <div class="liquid-glass-card ${isPinned ? 'is-pinned' : ''}">
            <div>
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="glass-pill px-2 py-1" style="font-size: 0.68rem; color: #475569;">Angkatan ${p.Angkatan}</span>
                    ${isPinned ? '<span class="glass-pill px-2 py-1 status-lunas"><i class="fas fa-user-check me-1"></i> Data Saya</span>' : ''}
                  </div>
                  <h5 class="fw-bold text-dark mb-0" style="letter-spacing: -0.3px;">${p['Nama Mahasiswa']}</h5>
                </div>
                <button class="glass-btn p-2" onclick="togglePinNama('${safeNama}')" title="Tandai data saya">
                  <i class="fas fa-star" style="color: ${isPinned ? '#f59e0b' : '#cbd5e1'};"></i>
                </button>
              </div>

              <!-- INSET BOX FINANSIAL -->
              <div class="finance-inset">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <div>
                    <div class="text-muted fw-bold" style="font-size: 0.68rem; text-transform: uppercase;">Masuk</div>
                    <div class="fw-bold fs-6 text-success">${formatRp(masuk)}</div>
                  </div>
                  <div class="text-end">
                    <div class="text-muted fw-bold" style="font-size: 0.68rem; text-transform: uppercase;">Sisa</div>
                    <div class="fw-bold fs-6 ${sisa > 0 ? 'text-danger' : 'text-muted'}">${formatRp(sisa)}</div>
                  </div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mt-2" style="font-size: 0.7rem;">
                  <span class="text-muted fw-semibold">Progres Pelunasan</span>
                  <span class="fw-bold text-dark">${pct}%</span>
                </div>
                <div class="clean-progress-track">
                  <div class="clean-progress-bar" style="width: ${pct}%;"></div>
                </div>
              </div>
            </div>

            <div>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <div>${getStatusPill(p.Status)}</div>
                <a href="javascript:void(0)" class="glass-btn" onclick="konfirmasiPerOrang('${safeNama}', '${p.Angkatan}')">
                  <i class="fab fa-whatsapp text-success"></i> Konfirmasi
                </a>
              </div>
              ${riwayatHtml}
            </div>
          </div>
        `);
      });
    }

    window.konfirmasiKeBendahara = function() {
      let pinnedNama = localStorage.getItem(PINNED_KEY);
      let mhs = globalData.find(p => p['Nama Mahasiswa'] === pinnedNama);
      let namaTeks = mhs ? mhs['Nama Mahasiswa'] : '[Nama Lengkap]';
      let angkatanTeks = mhs ? mhs.Angkatan : '[Angkatan]';

      let pesan = `Assalamu'alaikum Bendahara, saya ${namaTeks} (Angkatan ${angkatanTeks}) mau konfirmasi transfer pembayaran ziarah. Terima kasih.`;
      window.open(`https://wa.me/${WA_BENDAHARA}?text=${encodeURIComponent(pesan)}`, '_blank');
    };

    window.konfirmasiPerOrang = function(nama, angkatan) {
      let pesan = `Assalamu'alaikum Bendahara, saya ${nama} (Angkatan ${angkatan}) sudah transfer cicilan ziarah. Berikut bukti transfernya. Terima kasih.`;
      window.open(`https://wa.me/${WA_BENDAHARA}?text=${encodeURIComponent(pesan)}`, '_blank');
    };

    document.getElementById('searchInput').addEventListener('input', () => renderCards());
    window.onload = () => fetchApiData(false);
  </script>
</body>
</html>
