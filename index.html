<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Transparansi Dana Ziaroh Wali 5 KKI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-base: #f6f8fb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-bg-hover: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-inset: inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -1px 2px rgba(15, 23, 42, 0.03);
      --glass-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.02);
      
      --emerald: #059669;
      --emerald-bg: rgba(16, 185, 129, 0.1);
      --emerald-border: rgba(16, 185, 129, 0.25);
      --amber: #d97706;
      --amber-bg: rgba(245, 158, 11, 0.1);
      --amber-border: rgba(245, 158, 11, 0.25);
      --rose: #e11d48;
      --rose-bg: rgba(225, 29, 72, 0.1);
      --rose-border: rgba(225, 29, 72, 0.25);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 15%, rgba(59, 130, 246, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      margin: 0;
      padding: 0;
      padding-bottom: 110px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    .header-section { text-align: center; padding: 28px 0 16px 0; }
    .header-title { font-weight: 800; letter-spacing: -0.5px; color: #0f172a; font-size: 1.55rem; margin-bottom: 6px; }
    .header-subtitle { color: var(--text-muted); font-size: 0.85rem; margin: 0; }

    /* SEARCH BAR */
    .search-panel { 
      background: var(--glass-bg); 
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px); 
      border: 1px solid var(--glass-border); 
      border-radius: 18px; 
      padding: 8px 10px; 
      box-shadow: var(--glass-shadow), var(--glass-inset); 
      margin-bottom: 20px; 
    }
    .search-input { 
      background: rgba(255, 255, 255, 0.7); 
      border: 1px solid rgba(226, 232, 240, 0.9); 
      border-radius: 12px; 
      padding: 9px 14px 9px 40px; 
      font-size: 0.88rem; 
      color: var(--text-main); 
      transition: all 0.2s ease; 
    }
    .search-input:focus { 
      background: #ffffff; 
      border-color: var(--emerald); 
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12); 
      outline: none; 
    }
    .btn-refresh { 
      background: rgba(255, 255, 255, 0.7); 
      border: 1px solid rgba(226, 232, 240, 0.9); 
      color: var(--text-muted); 
      border-radius: 12px; 
      padding: 9px 14px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 0.82rem; 
      transition: all 0.2s; 
    }
    .btn-refresh:hover { background: #ffffff; color: var(--emerald); }

    /* GRID */
    .cards-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 768px) { .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 18px; } }
    @media (min-width: 1100px) { .cards-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }

    /* CARD PESERTA */
    .participant-card { 
      background: var(--glass-bg); 
      backdrop-filter: blur(25px); 
      -webkit-backdrop-filter: blur(25px); 
      border: 1.2px solid var(--glass-border); 
      border-radius: 20px; 
      padding: 18px; 
      box-shadow: var(--glass-shadow), var(--glass-inset); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; 
      position: relative; 
    }
    .participant-card:hover { 
      background: var(--glass-bg-hover); 
      transform: translateY(-2px); 
      box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.07), var(--glass-inset); 
    }
    .participant-card.is-pinned { 
      border: 1.5px solid var(--emerald-border); 
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.7) 0%, rgba(255, 255, 255, 0.8) 100%); 
    }
    .participant-card.is-pinned::before { 
      content: ''; 
      position: absolute; 
      left: 0; top: 0; bottom: 0; 
      width: 4px; 
      background: var(--emerald); 
      border-top-left-radius: 20px; 
      border-bottom-left-radius: 20px; 
    }

    .badge-mydata { 
      background: var(--emerald-bg); 
      color: var(--emerald); 
      border: 1px solid var(--emerald-border); 
      padding: 2px 7px; 
      border-radius: 6px; 
      font-size: 0.68rem; 
      font-weight: 700; 
      display: inline-flex; 
      align-items: center; 
      gap: 3px; 
    }
    .badge-angkatan { 
      background: rgba(241, 245, 249, 0.8); 
      border: 1px solid rgba(226, 232, 240, 0.8); 
      color: #64748b; 
      padding: 2px 7px; 
      border-radius: 6px; 
      font-size: 0.7rem; 
      font-weight: 600; 
    }
    .status-pill { 
      padding: 3px 9px; 
      border-radius: 20px; 
      font-size: 0.7rem; 
      font-weight: 700; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
    }
    .status-lunas { background: var(--emerald-bg); color: var(--emerald); border: 1px solid var(--emerald-border); }
    .status-cicilan { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
    .status-belum { background: var(--rose-bg); color: var(--rose); border: 1px solid var(--rose-border); }

    .star-btn { 
      background: rgba(255, 255, 255, 0.8); 
      border: 1px solid #e2e8f0; 
      width: 30px; 
      height: 30px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      color: #cbd5e1; 
      font-size: 0.88rem; 
      transition: all 0.2s; 
    }
    .star-btn:hover { color: #f59e0b; }
    .star-btn.active { color: #f59e0b; background: #fffbeb; border-color: #fde68a; }

    .finance-box { 
      background: rgba(255, 255, 255, 0.5); 
      border: 1px solid rgba(226, 232, 240, 0.8); 
      border-radius: 12px; 
      padding: 10px 12px; 
      margin: 10px 0 8px 0; 
    }
    .finance-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .finance-val { font-size: 0.95rem; font-weight: 800; }
    .clean-progress-track { height: 5px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-top: 6px; }
    .clean-progress-bar { height: 100%; background: var(--emerald); border-radius: 10px; transition: width 0.3s ease; }

    .riwayat-card { 
      background: rgba(255, 255, 255, 0.65); 
      border: 1px solid rgba(226, 232, 240, 0.8); 
      border-radius: 9px; 
      padding: 7px 10px; 
      margin-bottom: 5px; 
      font-size: 0.78rem; 
    }
    .btn-wa-action { 
      background: rgba(255, 255, 255, 0.8); 
      border: 1px solid #cbd5e1; 
      color: #334155; 
      border-radius: 9px; 
      padding: 5px 10px; 
      font-size: 0.72rem; 
      font-weight: 600; 
      display: inline-flex; 
      align-items: center; 
      gap: 4px; 
      text-decoration: none; 
      transition: all 0.2s; 
    }
    .btn-wa-action:hover { background: var(--emerald); border-color: var(--emerald); color: #ffffff; }

    /* DOCK */
    .liquid-dock-wrapper { 
      position: fixed; 
      bottom: 20px; 
      left: 0; right: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      z-index: 9999; 
      pointer-events: none; 
    }
    .liquid-dock { 
      pointer-events: auto; 
      background: rgba(255, 255, 255, 0.38); 
      backdrop-filter: blur(28px) saturate(210%); 
      -webkit-backdrop-filter: blur(28px) saturate(210%); 
      border: 1.5px solid rgba(255, 255, 255, 0.85); 
      border-radius: 999px; 
      padding: 4px 6px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
      box-shadow: 
        0 16px 36px -6px rgba(15, 23, 42, 0.12), 
        0 4px 12px rgba(0, 0, 0, 0.04), 
        inset 0 2px 3px rgba(255, 255, 255, 0.95), 
        inset 0 -2px 3px rgba(15, 23, 42, 0.04); 
      width: max-content; 
      max-width: calc(100vw - 32px); 
    }
    .dock-btn { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 6px 16px; 
      border-radius: 999px; 
      color: #334155; 
      text-decoration: none; 
      font-size: 0.7rem; 
      font-weight: 700; 
      line-height: 1.1; 
      white-space: nowrap; 
      cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
      user-select: none; 
      min-width: 78px; 
    }
    .dock-btn i { font-size: 1.05rem; margin-bottom: 3px; line-height: 1; }
    .dock-btn:hover { color: #0f172a; }
    .dock-btn.active { 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(10px); 
      color: #ffffff; 
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.3); 
    }
    .dock-btn.active i { color: #ffffff !important; }
    .dock-btn.wa-item { color: #059669; }

    /* TOAST */
    .toast-alert { 
      position: fixed; 
      top: 18px; 
      right: 18px; 
      left: 18px; 
      max-width: 350px; 
      margin: auto; 
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(20px); 
      border: 1px solid var(--glass-border); 
      box-shadow: 0 8px 20px rgba(0,0,0,0.06); 
      border-radius: 14px; 
      padding: 12px 14px; 
      z-index: 10000; 
      transform: translateY(-100px); 
      opacity: 0; 
      visibility: hidden; 
      transition: all 0.3s ease; 
    }
    .toast-alert.show { transform: translateY(0); opacity: 1; visibility: visible; }
  </style>
</head>
<body>

  <!-- TOAST PENGINGAT -->
  <div id="notes-popup" class="toast-alert">
    <div class="d-flex align-items-center gap-3">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--emerald-bg); color: var(--emerald); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i class="fas fa-bell" style="font-size: 0.8rem;"></i>
      </div>
      <div class="flex-grow-1">
        <h6 class="fw-bold mb-0" style="font-size: 0.8rem;">Pengingat Panitia</h6>
        <p class="text-muted mb-0" style="font-size: 0.72rem;">Jangan lupa dilunasi sebelum bulan Oktober ya 😊</p>
      </div>
      <button class="btn btn-sm text-muted p-0" onclick="document.getElementById('notes-popup').classList.remove('show')"><i class="fas fa-times"></i></button>
    </div>
  </div>

  <!-- KONTEN UTAMA (LANGSUNG DITAMPILKAN SECARA INSTAN) -->
  <div class="container-xl px-3 px-md-4" id="main-content" style="max-width: 1200px;">
    <div class="header-section">
      <h2 class="header-title">Transparansi Dana Ziaroh Wali 5 KKI</h2>
      <p class="header-subtitle">Jangan lupa konfirmasi ke panitia setiap melakukan pembayaran!</p>
    </div>

    <!-- SPOTLIGHT SEARCH BAR -->
    <div class="search-panel" id="searchSection">
      <div class="d-flex gap-2">
        <div class="position-relative flex-grow-1">
          <i class="fas fa-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted" style="font-size: 0.85rem;"></i>
          <input type="text" id="searchInput" class="form-control search-input w-100" placeholder="Ketik nama mahasiswa atau angkatan...">
        </div>
        <button class="btn-refresh d-flex align-items-center gap-2" onclick="fetchApiData(true)" title="Muat Ulang Data">
          <i class="fas fa-sync-alt" id="refreshIcon"></i> <span class="d-none d-sm-inline">Refresh</span>
        </button>
      </div>
    </div>

    <!-- RESPONSIVE CARDS CONTAINER -->
    <div id="cards-container" class="cards-grid">
      <div class="text-center py-5 text-muted col-12">
        <div class="spinner-border text-success spinner-border-sm me-2" role="status"></div> Mengambil data live...
      </div>
    </div>
  </div>

  <!-- AUTHENTIC LIQUID GLASS DOCK -->
  <div class="liquid-dock-wrapper" id="dockWrapper">
    <div class="liquid-dock">
      <div class="dock-btn" onclick="dockAksiCari()">
        <i class="fas fa-search"></i><span>Cari</span>
      </div>
      <div class="dock-btn" id="dockDataSaya" onclick="toggleFilterDataSaya()">
        <i class="fas fa-star" style="color: #f59e0b;"></i><span>Data Saya</span>
      </div>
      <div class="dock-btn wa-item" onclick="konfirmasiKeBendahara()">
        <i class="fab fa-whatsapp"></i><span>Bendahara</span>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQe5Nm70lQBXLiIA7V35pAp-oYhXkjPObEGhFxd-nkb8aLx8Dsz5R78lk6mSz-jp4Pzg/exec";
    const WA_BENDAHARA = "6282131652906";

    const CACHE_KEY = "ziarah_peserta_cache";
    const PINNED_KEY = "ziarah_pinned_nama";

    const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
    
    const getStatusBadge = (status) => {
      let s = status ? status.toString().toUpperCase() : '';
      if(s === 'LUNAS') return `<span class="status-pill status-lunas"><i class="fas fa-check-circle"></i> Lunas</span>`;
      if(s === 'CICILAN') return `<span class="status-pill status-cicilan"><i class="fas fa-coins"></i> Cicilan</span>`;
      return `<span class="status-pill status-belum"><i class="fas fa-clock"></i> Belum Bayar</span>`;
    };

    let globalData = [];
    let isFilterDataSayaActive = false;

    // --- FETCH DATA CEPAT DENGAN TEKNIK SWR (INSTANT LOAD) ---
    async function fetchApiData(forceRefresh = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      // 1. CEK CACHE LOKAL: Tampilkan data langsung jika pernah buka sebelumnya (0.1 detik!)
      const localCached = localStorage.getItem(CACHE_KEY);
      if (localCached && !forceRefresh) {
        try {
          const parsed = JSON.parse(localCached);
          if (parsed && parsed.data && parsed.data.length > 0) {
            globalData = parsed.data;
            renderCards(); // Gambar kartu langsung tanpa jeda
          }
        } catch (e) {}
      }

      // 2. FETCH KE GOOGLE APPS SCRIPT DI LATAR BELAKANG
      // Batas waktu 30 detik untuk mengakomodasi Cold Start server Google
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?api=true`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const resData = await response.json();
        const incomingData = Array.isArray(resData) ? resData : (resData.peserta ? resData.peserta : []);

        if (incomingData && incomingData.length > 0) {
          globalData = incomingData;
          // Simpan ke localStorage agar kunjungan berikutnya langsung instan
          localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: globalData }));
          renderCards();
          setTimeout(() => { 
            const notes = document.getElementById('notes-popup');
            if (notes) notes.classList.add('show'); 
          }, 600);
        }

      } catch (error) {
        clearTimeout(timeoutId);
        console.error("Gagal sinkron data:", error);
        
        // Tampilkan peringatan HANYA jika memori lokal benar-benar kosong
        const container = document.getElementById('cards-container');
        if (container && (!globalData || globalData.length === 0)) {
          container.innerHTML = `
            <div class="participant-card text-center py-5 text-danger col-12">
              <i class="fas fa-exclamation-triangle mb-2" style="font-size: 1.5rem;"></i>
              <div class="fw-bold mb-1">Server Google sedang bangun...</div>
              <div class="small text-muted mb-3">Silakan klik tombol di bawah untuk mencoba kembali.</div>
              <button class="btn btn-sm btn-dark rounded-pill px-4" onclick="fetchApiData(true)">
                <i class="fas fa-sync-alt me-1"></i> Muat Ulang
              </button>
            </div>`;
        }
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }

    // --- DOCK ACTIONS ---
    window.dockAksiCari = function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      const searchInp = document.getElementById('searchInput');
      setTimeout(() => searchInp.focus(), 300);
    };

    window.toggleFilterDataSaya = function() {
      isFilterDataSayaActive = !isFilterDataSayaActive;
      const dockBtn = document.getElementById('dockDataSaya');
      
      if (isFilterDataSayaActive) {
        dockBtn.classList.add('active');
      } else {
        dockBtn.classList.remove('active');
      }
      renderCards();
    };

    window.resetKeSemuaPeserta = function() {
      isFilterDataSayaActive = false;
      const dockBtn = document.getElementById('dockDataSaya');
      if (dockBtn) dockBtn.classList.remove('active');
      document.getElementById('searchInput').value = '';
      renderCards();
    };

    window.togglePinNama = function(nama) {
      let savedPin = localStorage.getItem(PINNED_KEY);
      if (savedPin === nama) localStorage.removeItem(PINNED_KEY);
      else localStorage.setItem(PINNED_KEY, nama);
      renderCards();
    };

    // --- RENDER GRID KARTU ---
    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      let kw = (document.getElementById('searchInput').value || '').toLowerCase();
      let pinnedNama = localStorage.getItem(PINNED_KEY) || '';

      let filtered = globalData.filter(p => {
        let matchKw = p['Nama Mahasiswa'].toLowerCase().includes(kw) || p.Angkatan.toString().toLowerCase().includes(kw);
        let matchDataSaya = isFilterDataSayaActive ? (p['Nama Mahasiswa'] === pinnedNama) : true;
        return matchKw && matchDataSaya;
      });

      if (filtered.length === 0) {
        if (isFilterDataSayaActive) {
          container.innerHTML = `
            <div class="participant-card text-center py-5 col-12">
              <div style="font-size: 2.2rem; margin-bottom: 12px;">⭐</div>
              <h6 class="fw-bold text-dark mb-1">Belum Ada Data yang Ditandai</h6>
              <p class="text-muted small mb-3">Tandai ikon bintang pada namamu agar mudah diakses di menu Data Saya.</p>
              <div>
                <button class="btn btn-sm btn-dark rounded-pill px-4 py-2 fw-semibold" onclick="resetKeSemuaPeserta()">
                  <i class="fas fa-arrow-left me-1"></i> Tampilkan Semua Peserta
                </button>
              </div>
            </div>`;
        } else {
          container.innerHTML = `
            <div class="participant-card text-center py-5 text-muted col-12">
              <i class="fas fa-search mb-2" style="font-size: 1.5rem;"></i>
              <div>Data peserta tidak ditemukan.</div>
            </div>`;
        }
        return;
      }

      if (!isFilterDataSayaActive) {
        filtered.sort((a, b) => {
          if (a['Nama Mahasiswa'] === pinnedNama) return -1;
          if (b['Nama Mahasiswa'] === pinnedNama) return 1;
          return 0;
        });
      }

      filtered.forEach((p) => {
        let isPinned = (p['Nama Mahasiswa'] === pinnedNama);
        let safeNama = p['Nama Mahasiswa'].replace(/'/g, "\\'");
        
        let target = p['Target Lunas'] || 0;
        let masuk = p['Total Masuk'] || 0;
        let sisa = p['Sisa Kurang'] || 0;
        let pct = target > 0 ? Math.min((masuk / target) * 100, 100).toFixed(0) : 0;

        let riwayatHtml = '';
        if (p.Riwayat && p.Riwayat.length > 0) {
          riwayatHtml = '<div class="mt-2"><div class="finance-label mb-1">Riwayat Pembayaran</div>';
          p.Riwayat.forEach(r => {
            riwayatHtml += `
              <div class="riwayat-card d-flex justify-content-between align-items-center">
                <div>
                  <div class="fw-bold text-dark"><i class="fas fa-check text-success me-1"></i> ${r.tgl}</div>
                  <div class="text-muted" style="font-size: 0.7rem; font-style: italic;">${r.ket || '-'}</div>
                </div>
                <div class="fw-bold text-success">${formatRp(r.nom)}</div>
              </div>`;
          });
          riwayatHtml += '</div>';
        }

        container.insertAdjacentHTML('beforeend', `
          <div class="participant-card ${isPinned ? 'is-pinned' : ''}">
            <div>
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="badge-angkatan">Angkatan ${p.Angkatan}</span>
                    ${isPinned ? '<span class="badge-mydata"><i class="fas fa-user-check"></i> Data Saya</span>' : ''}
                  </div>
                  <h6 class="fw-bold text-dark mb-0">${p['Nama Mahasiswa']}</h6>
                </div>
                <button class="star-btn ${isPinned ? 'active' : ''}" onclick="togglePinNama('${safeNama}')" title="Tandai data saya">
                  <i class="fas fa-star"></i>
                </button>
              </div>

              <div class="finance-box">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <div>
                    <div class="finance-label">Dana Masuk</div>
                    <div class="finance-val text-success">${formatRp(masuk)}</div>
                  </div>
                  <div class="text-end">
                    <div class="finance-label">Sisa Kurang</div>
                    <div class="finance-val ${sisa > 0 ? 'text-danger' : 'text-muted'}">${formatRp(sisa)}</div>
                  </div>
                </div>
                
                <div class="d-flex justify-content-between align-items-center small text-muted mt-2" style="font-size: 0.7rem;">
                  <span>Progres Pelunasan</span>
                  <span class="fw-bold text-dark">${pct}%</span>
                </div>
                <div class="clean-progress-track">
                  <div class="clean-progress-bar" style="width: ${pct}%;"></div>
                </div>
              </div>
            </div>

            <div>
              <div class="d-flex justify-content-between align-items-center mt-2">
                <div>${getStatusBadge(p.Status)}</div>
                <a href="javascript:void(0)" class="btn-wa-action" onclick="konfirmasiPerOrang('${safeNama}', '${p.Angkatan}')">
                  <i class="fab fa-whatsapp text-success"></i> Konfirmasi
                </a>
              </div>
              ${riwayatHtml}
            </div>
          </div>
        `);
      });
    }

    window.konfirmasiKeBendahara = function() {
      let pinnedNama = localStorage.getItem(PINNED_KEY);
      let mhs = globalData.find(p => p['Nama Mahasiswa'] === pinnedNama);
      let namaTeks = mhs ? mhs['Nama Mahasiswa'] : '[Nama Lengkap]';
      let angkatanTeks = mhs ? mhs.Angkatan : '[Angkatan]';

      let pesan = `Assalamu'alaikum Bendahara, saya ${namaTeks} (Angkatan ${angkatanTeks}) mau konfirmasi transfer pembayaran ziarah. Berikut saya lampirkan bukti transfernya. Terima kasih.`;
      window.open(`https://wa.me/${WA_BENDAHARA}?text=${encodeURIComponent(pesan)}`, '_blank');
    };

    window.konfirmasiPerOrang = function(nama, angkatan) {
      let pesan = `Assalamu'alaikum Bendahara, saya ${nama} (Angkatan ${angkatan}) sudah transfer cicilan ziarah. Berikut bukti transfernya. Terima kasih.`;
      window.open(`https://wa.me/${WA_BENDAHARA}?text=${encodeURIComponent(pesan)}`, '_blank');
    };

    document.getElementById('searchInput').addEventListener('input', () => renderCards());
    window.onload = () => fetchApiData(false);
  </script>
</body>
</html>
